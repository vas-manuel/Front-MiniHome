<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>MoniHome – ícono maestro</title>
  <defs>
    <linearGradient id="mh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0BD2FB"/>
      <stop offset="0.5" stop-color="#6CC24A"/>
      <stop offset="1" stop-color="#FFD801"/>
    </linearGradient>
    <linearGradient id="mh-inside" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A8FB8"/>
      <stop offset="1" stop-color="#3E9E5A"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#mh-bg)"/>
  <g transform="translate(-6 40)">
  <!-- interior de la billetera abierta -->
  <path d="M236 400 L664 272 Q770 246 780 320 L784 400 Z" fill="url(#mh-inside)" opacity="0.55"/>
  <!-- cuerpo -->
  <rect x="200" y="380" width="600" height="420" rx="96" fill="#FFFFFF"/>
  <!-- solapa / tapa -->
  <path d="M236 392 L664 264" stroke="#FFFFFF" stroke-width="56" stroke-linecap="round" fill="none"/>
  <!-- broche -->
  <rect x="732" y="522" width="124" height="132" rx="44" fill="#FFFFFF" stroke="#E0B800" stroke-width="20"/>
  <!-- check -->
  <path d="M686 226 L742 282 L850 174" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- cara -->
  <circle cx="420" cy="560" r="34" fill="#0576D4"/>
  <circle cx="580" cy="560" r="34" fill="#0576D4"/>
  <path d="M410 650 Q500 720 590 650" stroke="#0576D4" stroke-width="30" stroke-linecap="round" fill="none"/>
</g>
</svg>
